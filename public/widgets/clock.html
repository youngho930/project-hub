<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
:root{--page:#191919;--ink:#ede9f7;--muted:#8f8ba8;--tile:#f3ecd9;--tile-low:#e9e1ca;--digit:#211d33;--u:min(1.12vw,2.15vh)}
html,body{margin:0;height:100%;background:var(--page);overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4.5);font-family:"IBM Plex Sans KR",system-ui,sans-serif}
.clock{display:flex;align-items:center;gap:calc(var(--u)*2.2)}
.tile{position:relative;width:calc(var(--u)*24);height:calc(var(--u)*21);border-radius:calc(var(--u)*2.4);perspective:calc(var(--u)*80);
  box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(0,0,0,.45)}
.half,.flap{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--tile);color:var(--digit);
  font:600 calc(var(--u)*17)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.top{top:0;border-radius:calc(var(--u)*2.4) calc(var(--u)*2.4) 0 0}
.bottom{bottom:0;border-radius:0 0 calc(var(--u)*2.4) calc(var(--u)*2.4);background:var(--tile-low)}
.half span,.flap span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center}
.top span{top:0}.bottom span{bottom:0}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(1px,calc(var(--u)*.35));margin-top:calc(var(--u)*-.17);background:rgba(25,25,25,.55);z-index:3}
.flap{z-index:2;backface-visibility:hidden}
.flap.down{top:0;transform-origin:50% 100%;border-radius:calc(var(--u)*2.4) calc(var(--u)*2.4) 0 0;animation:fold .26s ease-in forwards}
.flap.up{bottom:0;transform-origin:50% 0;border-radius:0 0 calc(var(--u)*2.4) calc(var(--u)*2.4);background:var(--tile-low);transform:rotateX(90deg);animation:unfold .26s .26s ease-out forwards}
.flap.down span{top:0}.flap.up span{bottom:0}
@keyframes fold{to{transform:rotateX(-90deg)}}
@keyframes unfold{to{transform:rotateX(0)}}
.sep{display:flex;flex-direction:column;gap:calc(var(--u)*3)}
.sep i{width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:50%;background:var(--muted);opacity:.7}
.date{color:var(--muted);font-size:calc(var(--u)*4.6);letter-spacing:.02em}
.date b{color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){.flap{display:none}}
</style></head>
<body>
<div class="clock" role="timer" aria-label="현재 시각">
  <div class="tile" data-k="h"></div><div class="sep" aria-hidden="true"><i></i><i></i></div>
  <div class="tile" data-k="m"></div><div class="sep" aria-hidden="true"><i></i><i></i></div>
  <div class="tile" data-k="s"></div>
</div>
<div class="date" id="date"></div>
<script>
const DAYS = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
const pad = n => String(n).padStart(2, "0");
const tiles = {};
document.querySelectorAll(".tile").forEach(t => {
  t.innerHTML = '<div class="half top"><span></span></div><div class="half bottom"><span></span></div>';
  tiles[t.dataset.k] = { el: t, val: null };
});
function setTile(k, v) {
  const t = tiles[k];
  if (t.val === v) return;
  const top = t.el.querySelector(".top span"), bottom = t.el.querySelector(".bottom span");
  if (t.val === null) { top.textContent = bottom.textContent = v; t.val = v; return; }
  const old = t.val; t.val = v;
  const down = document.createElement("div"); down.className = "flap down"; down.innerHTML = "<span>" + old + "</span>";
  const up = document.createElement("div"); up.className = "flap up"; up.innerHTML = "<span>" + v + "</span>";
  top.textContent = v;
  t.el.append(down, up);
  up.addEventListener("animationend", () => { bottom.textContent = v; down.remove(); up.remove(); }, { once: true });
  setTimeout(() => { if (up.isConnected) { bottom.textContent = v; down.remove(); up.remove(); } }, 900);
}
function tick() {
  const d = new Date();
  setTile("h", pad(d.getHours())); setTile("m", pad(d.getMinutes())); setTile("s", pad(d.getSeconds()));
  document.getElementById("date").innerHTML = "<b>" + (d.getMonth() + 1) + "월 " + d.getDate() + "일</b> " + DAYS[d.getDay()];
}
tick();
setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - new Date().getMilliseconds());
</script></body></html>
