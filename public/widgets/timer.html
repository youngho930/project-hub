<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Focus timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
:root{--page:#191919;--ink:#ede9f7;--muted:#8f8ba8;--lamp:#f2c66d;--river:#8db4f0;--track:#2b2938;--u:min(1.05vw,1.5vh)}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);font-family:"IBM Plex Sans KR",system-ui,sans-serif}
.modes{display:flex;gap:calc(var(--u)*4)}
.modes button{all:unset;cursor:pointer;font-size:calc(var(--u)*3.8);color:var(--muted);padding-bottom:calc(var(--u)*.8);border-bottom:2px solid transparent}
.modes button[aria-pressed="true"]{color:var(--ink);border-color:var(--lamp)}
body.break .modes button[aria-pressed="true"]{border-color:var(--river)}
.ring{position:relative;width:calc(var(--u)*36);height:calc(var(--u)*36)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.2}
.ring .track{stroke:var(--track)}
.ring .bar{stroke:var(--lamp);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
body.break .ring .bar{stroke:var(--river)}
.time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time b{font:600 calc(var(--u)*11.5)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.time small{font-size:calc(var(--u)*3.2);color:var(--muted);margin-top:calc(var(--u)*.6)}
.actions{display:flex;gap:calc(var(--u)*2)}
.actions button{all:unset;cursor:pointer;font-size:calc(var(--u)*3.8);font-weight:500;padding:calc(var(--u)*1.6) calc(var(--u)*4.4);border-radius:999px}
#go{background:var(--lamp);color:#1d1a12}
body.break #go{background:var(--river);color:#121826}
#reset{color:var(--muted);box-shadow:inset 0 0 0 1px #3a3748}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.count{font-size:calc(var(--u)*3.4);color:var(--muted)}
body.done .ring{animation:pulse 1.2s ease-out 2}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){body.done .ring{animation:none}.ring .bar{transition:none}}
</style></head>
<body>
<div class="modes" role="group" aria-label="모드">
  <button data-mode="focus" aria-pressed="true">집중 25분</button><button data-mode="break" aria-pressed="false">휴식 5분</button>
</div>
<div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46"/><circle class="bar" id="bar" cx="50" cy="50" r="46"/></svg>
  <div class="time" aria-live="polite"><b id="t">25:00</b><small id="label">집중</small></div></div>
<div class="actions"><button id="go">시작</button><button id="reset">초기화</button></div>
<div class="count" id="count"></div>
<script>
const LEN = { focus: 25 * 60, break: 5 * 60 }, C = 2 * Math.PI * 46;
let mode = "focus", left = LEN.focus, endAt = null, tick = null;
const bar = document.getElementById("bar"), go = document.getElementById("go");
bar.style.strokeDasharray = C;
const d0 = new Date(), key = "focus-" + d0.getFullYear() + "-" + (d0.getMonth() + 1) + "-" + d0.getDate();
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
let count = Number(store(key)) || 0;
const showCount = () => document.getElementById("count").textContent = count ? "오늘 " + count + "번 집중했어요" : "25분 집중하고 5분 쉬어요";
showCount();
const remaining = () => endAt ? Math.max(0, Math.round((endAt - Date.now()) / 1000)) : left;
function draw() {
  const r = remaining();
  document.getElementById("t").textContent = String(Math.floor(r / 60)).padStart(2, "0") + ":" + String(r % 60).padStart(2, "0");
  bar.style.strokeDashoffset = C * (r / LEN[mode]);
  if (endAt && r === 0) finish();
}
function chime() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18, .36].forEach((t, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = [660, 880, 990][i];
      g.gain.setValueAtTime(.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.12, ac.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t + .5);
      o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .55);
    });
  } catch (e) {}
}
// Notion reloads the widget whenever the page is reopened, so the timer keeps its state in localStorage.
const SKEY = "focus-timer-state";
const save = () => store(SKEY, JSON.stringify({ mode, left, endAt }));
function showMode() {
  document.body.classList.toggle("break", mode === "break");
  document.getElementById("label").textContent = mode === "focus" ? "집중" : "휴식";
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
}
function finish(quiet) {
  clearInterval(tick); tick = null; endAt = null;
  if (!quiet) chime();
  if (mode === "focus") { count++; store(key, String(count)); showCount(); }
  setMode(mode === "focus" ? "break" : "focus");
  if (!quiet) { document.body.classList.remove("done"); void document.body.offsetWidth; document.body.classList.add("done"); }
}
function setMode(m) {
  mode = m; left = LEN[m]; endAt = null; clearInterval(tick); tick = null; go.textContent = "시작";
  showMode(); save(); draw();
}
go.onclick = () => {
  if (endAt) { left = remaining(); endAt = null; clearInterval(tick); tick = null; go.textContent = "계속"; save(); draw(); return; }
  endAt = Date.now() + left * 1000; go.textContent = "멈춤"; tick = setInterval(draw, 250); save(); draw();
};
document.getElementById("reset").onclick = () => setMode(mode);
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
(function restore() {
  let s = null;
  try { s = JSON.parse(store(SKEY) || "null"); } catch (e) {}
  if (!s || !LEN[s.mode]) { showMode(); draw(); return; }
  mode = s.mode; left = Math.min(Number(s.left) || LEN[mode], LEN[mode]); endAt = s.endAt || null;
  showMode();
  if (endAt && endAt <= Date.now()) { finish(true); return; }   // ended while the page was closed
  if (endAt) { go.textContent = "멈춤"; tick = setInterval(draw, 250); }
  else if (left < LEN[mode]) go.textContent = "계속";
  draw();
})();
</script></body></html>
