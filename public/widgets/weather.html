<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
:root{--page:#191919;--ink:#ede9f7;--muted:#8f8ba8;--lamp:#f2c66d;--river:#8db4f0;--cloud:#c9c4de;--cloud-back:#6f6a8a;--moon:#f3ecd9;--u:min(1.1vw,2.1vh)}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*6);font-family:"IBM Plex Sans KR",system-ui,sans-serif}
.now{display:flex;align-items:center;gap:calc(var(--u)*3)}
.now svg{width:calc(var(--u)*15);height:calc(var(--u)*15)}
.temp{font:600 calc(var(--u)*17)/.9 "Barlow Condensed",sans-serif;letter-spacing:-.01em}
.meta{display:flex;flex-direction:column;gap:calc(var(--u)*.8)}
.desc{font-size:calc(var(--u)*4.6);font-weight:500;white-space:nowrap}
.place{font-size:calc(var(--u)*3.6);color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(5,calc(var(--u)*14.5));justify-content:center}
.day{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1)}
.day .name{font-size:calc(var(--u)*3.8);color:var(--muted)}
.day .name.today{color:var(--ink);font-weight:500}
.day svg{width:calc(var(--u)*8.4);height:calc(var(--u)*8.4)}
.day .hi{font:500 calc(var(--u)*5)/1 "Barlow Condensed",sans-serif}
.day .lo{font:500 calc(var(--u)*5)/1 "Barlow Condensed",sans-serif;color:var(--muted)}
.msg{font-size:calc(var(--u)*3.8);color:var(--muted);text-align:center;line-height:1.6;max-width:80vw}
</style></head>
<body>
<div class="now"><span id="icon"></span><span class="temp" id="temp">--°</span>
  <div class="meta"><span class="desc" id="desc">불러오는 중</span><span class="place" id="place">서울</span></div></div>
<div class="days" id="days"></div>
<div class="msg" id="msg" hidden></div>
<script>
const Q = new URLSearchParams(location.search);
const LAT = Number(Q.get("lat")) || 37.5665, LON = Number(Q.get("lon")) || 126.978;
if (Q.get("name")) document.getElementById("place").textContent = Q.get("name");
const KDAY = ["일","월","화","수","목","금","토"];
const LABEL = { clear:"맑음", partly:"구름 조금", cloud:"흐림", fog:"안개", rain:"비", snow:"눈", storm:"뇌우" };
function kind(c) {
  if (c === 0) return "clear";
  if (c <= 2) return "partly";
  if (c === 3) return "cloud";
  if (c === 45 || c === 48) return "fog";
  if (c >= 95) return "storm";
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
  if (c >= 51) return "rain";
  return "cloud";
}
const sun = (cx, cy, r, ray) => {
  let s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="var(--lamp)"/>';
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4, x1 = cx + Math.cos(a) * (r + 3), y1 = cy + Math.sin(a) * (r + 3), x2 = cx + Math.cos(a) * (r + ray), y2 = cy + Math.sin(a) * (r + ray);
    s += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--lamp)" stroke-width="2.6" stroke-linecap="round"/>';
  }
  return s;
};
const moon = (cx, cy, r) => '<path fill="var(--moon)" d="M' + (cx + r * .35) + ' ' + (cy - r) + 'A' + r + ' ' + r + ' 0 1 0 ' + (cx + r) + ' ' + (cy + r * .35) + 'A' + (r * .78) + ' ' + (r * .78) + ' 0 1 1 ' + (cx + r * .35) + ' ' + (cy - r) + 'Z"/>';
const cloud = (dx, dy, fill) => '<g fill="' + fill + '" transform="translate(' + dx + ' ' + dy + ')"><circle cx="17" cy="29" r="7.5"/><circle cx="26.5" cy="23.5" r="10"/><circle cx="35" cy="30" r="6.5"/><rect x="11" y="28.5" width="30" height="8" rx="4"/></g>';
function icon(k, day) {
  let g = "";
  if (k === "clear") g = day ? sun(24, 24, 9, 7) : moon(24, 24, 12);
  else if (k === "partly") g = (day ? sun(17, 17, 6.5, 5) : moon(18, 17, 9)) + cloud(3, 4, "var(--cloud)");
  else if (k === "cloud") g = cloud(-4, -5, "var(--cloud-back)") + cloud(2, 2, "var(--cloud)");
  else if (k === "fog") g = [14, 22, 30, 38].map((y, i) => '<line x1="' + (8 + i % 2 * 5) + '" y1="' + y + '" x2="' + (40 - i % 2 * 4) + '" y2="' + y + '" stroke="var(--cloud)" stroke-width="3" stroke-linecap="round"/>').join("");
  else {
    g = cloud(0, -5, k === "storm" ? "var(--cloud-back)" : "var(--cloud)");
    if (k === "rain") g += [[16, 38], [24, 41], [32, 38]].map(([x, y]) => '<line x1="' + x + '" y1="' + y + '" x2="' + (x - 2) + '" y2="' + (y + 5) + '" stroke="var(--river)" stroke-width="2.6" stroke-linecap="round"/>').join("");
    if (k === "snow") g += [[16, 39], [24, 43], [32, 39]].map(([x, y]) => '<circle cx="' + x + '" cy="' + y + '" r="2.2" fill="var(--ink)"/>').join("");
    if (k === "storm") g += '<path d="M25 30l-6 9h5l-3 8 9-11h-5l3-6z" fill="var(--lamp)"/>';
  }
  return '<svg viewBox="0 0 48 48" aria-hidden="true">' + g + "</svg>";
}
function render(d) {
  const k = kind(d.current.weather_code);
  document.getElementById("icon").innerHTML = icon(k, d.current.is_day === 1);
  document.getElementById("temp").textContent = Math.round(d.current.temperature_2m) + "°";
  document.getElementById("desc").textContent = LABEL[k];
  document.getElementById("days").innerHTML = d.daily.time.slice(0, 5).map((iso, i) =>
    '<div class="day"><span class="name' + (i === 0 ? " today" : "") + '">' + (i === 0 ? "오늘" : KDAY[new Date(iso + "T00:00:00").getDay()]) + "</span>" +
    icon(kind(d.daily.weather_code[i]), true) +
    '<span class="hi">' + Math.round(d.daily.temperature_2m_max[i]) + '°</span><span class="lo">' + Math.round(d.daily.temperature_2m_min[i]) + "°</span></div>").join("");
  document.getElementById("msg").hidden = true;
}
function fail() {
  if (document.getElementById("days").children.length) return;
  document.getElementById("desc").textContent = "날씨를 불러오지 못했어요";
  const m = document.getElementById("msg"); m.hidden = false; m.textContent = "잠시 뒤 새로고침하면 다시 시도해요.";
}
async function load() {
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
      "&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=5");
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) { fail(); }
}
if (window.__WEATHER_SAMPLE__) render(window.__WEATHER_SAMPLE__); else load();
setInterval(load, 30 * 60 * 1000);
</script></body></html>
